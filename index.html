<style>
:root {

body {

.field input, .field select { border:1px solid var(--line); border-radius:2px; padding:8px 9px;
  background:var(--card); font-family:var(--mono); font-size:14px; color:var(--ink); width:100%; }
.check { display:flex; align-items:flex-start; gap:8px; margin-top:10px; font-family:var(--mono);
  font-size:11.5px; line-height:1.5; }
.check input { width:16px; height:16px; accent-color:var(--grund); flex:none; margin-top:1px; }
.rules { font-family:var(--mono); font-size:11px; color:var(--ink2); line-height:1.8; margin-top:14px;
  border-top:1px solid var(--line); padding-top:12px; }
.rules b { color:var(--ink); }
.reset { margin-top:16px; border:none; background:none; padding:0; font-family:var(--mono);
  font-size:11px; color:var(--p70); text-decoration:underline; text-underline-offset:3px; }
.legend { display:flex; flex-wrap:wrap; gap:12px; margin-top:10px; font-family:var(--mono);
  font-size:10px; color:var(--ink2); }
.legend span { display:flex; align-items:center; gap:5px; }
.note { font-family:var(--mono); font-size:10.5px; color:var(--ink2); text-align:center;
  margin-top:16px; line-height:1.7; }
.note a { color:var(--ink2); }
@media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
</style>

<body>
<div class="wrap">
  <div class="head">
    <button class="btn" id="prev" aria-label="Föregående månad">‹</button>
    <button class="btn" id="next" aria-label="Nästa månad">›</button>
    <h1 class="month" id="titel"></h1>
    <button class="btn" id="toggleSet">Lön</button>
  </div>

  <div id="setBox"></div>

  <div class="cols">
    <div class="stub-col">
      <div class="stub" id="stub"></div>
      <div class="note" id="medd" hidden></div>
    </div>
    <div>
      <div class="cal">
        <div class="dow" id="dow"></div>
        <div class="grid" id="grid"></div>
      </div>
      <div class="legend">
        <span><i class="dot" style="background:var(--grund)"></i>Utan OB</span>
        <span><i class="dot" style="background:var(--p50)"></i>50 %</span>
        <span><i class="dot" style="background:var(--p70)"></i>70 %</span>
        <span><i class="dot" style="background:var(--p100)"></i>100 %</span>
      </div>
      <div id="edBox"></div>
    </div>

  <div class="note" id="fot"></div>

<script>
"use strict";

/* ================================================================== */
/*  Datum och helgdagar                                               */
/* ================================================================== */

var MAN = ["januari","februari","mars","april","maj","juni",
  "juli","augusti","september","oktober","november","december"];
var DAG = ["Söndag","Måndag","Tisdag","Onsdag","Torsdag","Fredag","Lördag"];
var DAG_K = ["Sön","Mån","Tis","Ons","Tor","Fre","Lör"];

function pad(n) { return String(n).padStart(2, "0"); }
function dagKey(d) { return (d.getMonth() + 1) + "-" + d.getDate(); }
function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }

function easter(y) {
  var a = y % 19, b = Math.floor(y / 100), c = y % 100;
  var d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
  var g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
  var i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7;
  var m = Math.floor((a + 11 * h + 22 * l) / 451);
  var mo = Math.floor((h + l - 7 * m + 114) / 31);
  var da = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(y, mo - 1, da);
}
function satBetween(y, mo, from, to) {
  for (var d = from; d <= to; d++) {
    var x = new Date(y, mo, d);
    if (x.getDay() === 6) return x;
  }
  return null;
}

var helgCache = {};
function helgdagar(y) {
  if (helgCache[y]) return helgCache[y];
  var e = easter(y);
  var midsommardagen = satBetween(y, 5, 20, 26);
  var map = {};
  function rod(d, namn) { map[dagKey(d)] = { typ: "rod", namn: namn }; }
  function halv(d, namn) { map[dagKey(d)] = { typ: "halv", namn: namn }; }

  rod(new Date(y, 0, 1), "Nyårsdagen");
  rod(new Date(y, 0, 6), "Trettondedag jul");
  rod(addDays(e, -2), "Långfredagen");
  rod(e, "Påskdagen");
  rod(addDays(e, 1), "Annandag påsk");
  rod(new Date(y, 4, 1), "Första maj");
  rod(addDays(e, 39), "Kristi himmelsfärdsdag");
  rod(new Date(y, 5, 6), "Nationaldagen");
  rod(addDays(e, 49), "Pingstdagen");
  if (midsommardagen) rod(midsommardagen, "Midsommardagen");
  var allhelgon = satBetween(y, 9, 31, 31) || satBetween(y, 10, 1, 6);
  if (allhelgon) rod(allhelgon, "Alla helgons dag");
  rod(new Date(y, 11, 25), "Juldagen");
  rod(new Date(y, 11, 26), "Annandag jul");

  halv(addDays(e, -1), "Påskafton");
  if (midsommardagen) halv(addDays(midsommardagen, -1), "Midsommarafton");
  halv(new Date(y, 11, 24), "Julafton");
  halv(new Date(y, 11, 31), "Nyårsafton");

  helgCache[y] = map;
  return map;
}
function dagInfo(d, on) { return on ? (helgdagar(d.getFullYear())[dagKey(d)] || null) : null; }

/* ================================================================== */
/*  OB-regler (butik enligt Handels, med Coops morgontillägg)         */
/* ================================================================== */

function bandsFor(d, o) {
  var info = dagInfo(d, o.rodaDagar);
  var out = [];
  function push(f, t, p) { if (t > f) out.push({ from: f, to: t, pct: p }); }
  var natt = o.nattOB ? 70 : 0;
  var morgon = o.coopMorgon ? 50 : 0;

  if (info && info.typ === "rod") { push(0, 1440, 100); return out; }
  var dow = d.getDay();
  if (dow === 0) { push(0, 1440, 100); return out; }
  if (dow === 6 || (info && info.typ === "halv")) {
    push(0, 300, natt); push(300, 360, morgon); push(360, 720, 0); push(720, 1440, 100);
    return out;
  }
  push(0, 300, natt); push(300, 360, morgon); push(360, 1095, 0);
  push(1095, 1200, 50); push(1200, 1440, 70);
  return out;
}

function toMin(t) {
  if (!t || !/^\d{1,2}:\d{2}$/.test(t)) return null;
  var p = t.split(":");
  var h = Number(p[0]), m = Number(p[1]);
  return (h > 23 || m > 59) ? null : h * 60 + m;
}

function raknaPass(d, p, o) {
  if (!p) return null;
  var s = toMin(p.s), e0 = toMin(p.e);
  if (s === null || e0 === null) return null;
  var e = e0 <= s ? e0 + 1440 : e0;
  var rast = Math.max(0, Math.min(e - s, Number(p.r) || 0));
  var mitt = (s + e) / 2;
  var delar = rast > 0
    ? [[s, mitt - rast / 2], [mitt + rast / 2, e]].filter(function (x) { return x[1] > x[0]; })
    : [[s, e]];

  var bands = bandsFor(d, o).slice();
  bandsFor(addDays(d, 1), o).forEach(function (b) {
    bands.push({ from: b.from + 1440, to: b.to + 1440, pct: b.pct });
  });

  var per = { 0: 0, 50: 0, 70: 0, 100: 0 };
  var t = 0;
  delar.forEach(function (iv) {
    t += (iv[1] - iv[0]) / 60;
    bands.forEach(function (band) {
      var lo = Math.max(iv[0], band.from), hi = Math.min(iv[1], band.to);
      if (hi > lo) per[band.pct] += (hi - lo) / 60;
    });
  });
  return { tim: t, per: per, overMidnatt: e > 1440 };
}

/* ================================================================== */
/*  Preliminärskatt, inkomstår 2026                                   */
/*  Följer Skatteverkets tekniska beskrivning av skattetabellerna.    */
/* ================================================================== */

var PBB = 59200;          // prisbasbelopp 2026
var IBB = 83400;          // inkomstbasbelopp 2026
var SKIKT = 643000;       // skiktgräns för statlig skatt
var APA_TAK = 673038;     // tak för allmän pensionsavgift
var PS_TAK = 1.42 * IBB;  // tak för public service-avgift

function grundavdragRaw(ffi) {
  var ga;
  if (ffi <= 0.99 * PBB) ga = 0.423 * PBB;
  else if (ffi <= 2.72 * PBB) ga = 0.423 * PBB + 0.2 * (ffi - 0.99 * PBB);
  else if (ffi <= 3.11 * PBB) ga = 0.77 * PBB;
  else if (ffi <= 7.88 * PBB) ga = 0.77 * PBB - 0.1 * (ffi - 3.11 * PBB);
  else ga = 0.293 * PBB;
  return Math.min(ga, ffi);
}
function forhojdDel(ffi) {
  var p = PBB;
  if (ffi <= 0.91 * p) return 0.687 * p;
  if (ffi <= 1.11 * p) return 0.885 * p - ffi * 0.2;
  if (ffi <= 1.965 * p) return 0.6 * p + ffi * 0.057;
  if (ffi <= 2.72 * p) return 0.333 * p + ffi * 0.1949;
  if (ffi <= 3.11 * p) return ffi * 0.3949 - 0.212 * p;
  if (ffi <= 3.24 * p) return ffi * 0.4949 - 0.523 * p;
  if (ffi <= 5.0 * p) return ffi * 0.356 - 0.073 * p;
  if (ffi <= 7.88 * p) return 0.017 * p + ffi * 0.338;
  if (ffi <= 8.08 * p) return 0.703 * p + ffi * 0.251;
  if (ffi <= 11.16 * p) return 2.732 * p;
  if (ffi <= 12.84 * p) return 9.651 * p - ffi * 0.62;
  return 1.691 * p;
}
function upp100(n) { return Math.ceil(n / 100) * 100; }

function jobbskatteavdrag(ai, ga, ki, aldre) {
  var x;
  if (aldre) {
    if (ai <= 1.75 * PBB) x = ai * 0.22;
    else if (ai <= 5.24 * PBB) x = 0.2635 * PBB + ai * 0.07;
    else x = 0.6293 * PBB;
    return Math.max(0, Math.floor(x));
  }
  if (ai <= 0.91 * PBB) x = ai - ga;
  else if (ai <= 3.24 * PBB) x = 0.91 * PBB + 0.3874 * (ai - 0.91 * PBB) - ga;
  else if (ai <= 8.08 * PBB) x = 1.813 * PBB + 0.251 * (ai - 3.24 * PBB) - ga;
  else x = 3.027 * PBB - ga;
  return Math.max(0, Math.floor(x * ki));
}

// Månadsinkomsten avrundas upp till toppen av tabellens inkomstskikt,
// precis som när arbetsgivaren läser i skattetabellen.
function skiktTopp(m) {
  if (m <= 20000) return Math.ceil(m / 100) * 100;
  if (m <= 80000) return 20000 + Math.ceil((m - 20000) / 200) * 200;
  return m;
}

function raknaSkatt(manadsBrutto, o) {
  if (!(manadsBrutto > 0)) return { skatt: 0, netto: 0, delar: null };

  var ki = (Number(o.kommunalskatt) || 0) / 100;
  var begr = (Number(o.begravningsavgift) || 0) / 100;
  var kyrko = o.kyrkomedlem ? (Number(o.kyrkoavgift) || 0) / 100 : 0;
  var aldre = o.alder === "66";

  var ffi = Math.floor((skiktTopp(manadsBrutto) * 12) / 100) * 100;
  var ga = aldre ? upp100(grundavdragRaw(ffi) + forhojdDel(ffi)) : upp100(grundavdragRaw(ffi));
  var bfi = Math.max(0, ffi - ga);

  var kommunal = Math.floor(bfi * ki);
  var statlig = (bfi - SKIKT >= 200) ? Math.floor((bfi - SKIKT) * 0.2) : 0;
  var avgifter = Math.floor(bfi * (begr + kyrko));

  // 7 %, avrundat till hundratal. Belopp som slutar på exakt 50 kr avrundas nedåt,
  // så råvärdet städas från flyttalsbrus först.
  var apa = 0;
  if (ffi >= 25042) {
    var raw = Math.round(0.07 * Math.min(ffi, APA_TAK) * 100) / 100;
    var hela = Math.floor(raw / 100);
    apa = ((raw - hela * 100 > 50) ? hela + 1 : hela) * 100;
  }

  var kvarK = kommunal, kvarS = statlig;
  var redApa = Math.min(apa, kvarK + kvarS);
  var apaFranK = Math.min(redApa, kvarK);
  kvarK -= apaFranK;
  kvarS -= redApa - apaFranK;

  var arbetsinkomst = Math.floor(ffi / 100) * 100;
  var jsa = Math.min(jobbskatteavdrag(arbetsinkomst, ga, ki, aldre), kvarK);
  kvarK -= jsa;

  var sfiFull = 0;
  if (bfi > 40000) sfiFull = bfi >= 240000 ? 1500 : Math.floor((bfi - 40000) * 0.0075);
  var sfi = Math.min(sfiFull, kvarK);
  kvarK -= sfi;

  var publicService = (o.alder === "u18") ? 0 : Math.floor(Math.min(bfi, PS_TAK) * 0.01);

  var arsskatt = kvarK + kvarS + avgifter + apa + publicService;
  var skatt = Math.round(arsskatt / 12);

  return {
    skatt: skatt,
    netto: manadsBrutto - skatt,
    delar: {
      kommunal: kommunal / 12,
      statlig: statlig / 12,
      jsa: jsa / 12,
      sfi: sfi / 12,
      apaNetto: (apa - redApa) / 12,
      avgifter: avgifter / 12,
      publicService: publicService / 12
    }
  };
}

/* ================================================================== */
/*  Formatering                                                       */
/* ================================================================== */

function kr(n) {
  var d = Math.abs(n).toFixed(2).split(".");
  return (n < 0 ? "−" : "") + d[0].replace(/\B(?=(\d{3})+(?!\d))/g, "\u00A0") + "," + d[1] + "\u00A0kr";
}
function tim(h) { return String(Math.round(h * 100) / 100).replace(".", ",") + " h"; }
function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
var FARG = { 0: "var(--grund)", 50: "var(--p50)", 70: "var(--p70)", 100: "var(--p100)" };

/* ================================================================== */
/*  Lagring i webbläsaren                                             */
/* ================================================================== */

var STANDARD = {
  form: "tim", timlon: 160.4, manadslon: 26626, rast: 30,
  coopMorgon: true, nattOB: true, rodaDagar: true,
  senaste: { s: "10:00", e: "18:00", r: 30 },
  raknaSkatt: true, kommunalskatt: 32.38, begravningsavgift: 0.292,
  kyrkomedlem: false, kyrkoavgift: 1.0, alder: "vux"
};

function las(nyckel, fallback) {
  try {
    var v = localStorage.getItem(nyckel);
    return v ? JSON.parse(v) : fallback;
  } catch (err) { return fallback; }
}
function spara(nyckel, varde) {
  try { localStorage.setItem(nyckel, JSON.stringify(varde)); return true; }
  catch (err) { return false; }
}

var nu = new Date();
var S = {
  pek: { y: nu.getFullYear(), m: nu.getMonth() },
  inst: Object.assign({}, STANDARD, las("coop:installningar", {})),
  pass: {},
  vald: null,
  visaInst: false,
  visaSkatt: false
};

function manadsId() { return S.pek.y + "-" + pad(S.pek.m + 1); }
function laddaManad() { S.pass = las("coop:" + manadsId(), {}); }
function sparaManad() {
  if (!spara("coop:" + manadsId(), S.pass)) visaMedd("Kunde inte spara. Webbläsaren tillåter inte lagring här.");
}
function sparaInst() { spara("coop:installningar", S.inst); }

function visaMedd(text) {
  var el = document.getElementById("medd");
  el.textContent = text || "";
  el.hidden = !text;
}

/* ================================================================== */
/*  Beräkning för hela månaden                                        */
/* ================================================================== */

function timlon() {
  return S.inst.form === "manad"
    ? (Number(S.inst.manadslon) || 0) / 166
    : (Number(S.inst.timlon) || 0);
}

function berakna() {
  var dagarIMan = new Date(S.pek.y, S.pek.m + 1, 0).getDate();
  var tl = timlon();
  var perDag = {}, per = { 0: 0, 50: 0, 70: 0, 100: 0 };
  var timmar = 0, dagar = 0;

  for (var d = 1; d <= dagarIMan; d++) {
    var r = raknaPass(new Date(S.pek.y, S.pek.m, d), S.pass[d], S.inst);
    if (!r || r.tim <= 0) continue;
    perDag[d] = r;
    timmar += r.tim; dagar++;
    [0, 50, 70, 100].forEach(function (k) { per[k] += r.per[k]; });
  }

  var obKr = { 50: per[50] * tl * 0.5, 70: per[70] * tl * 0.7, 100: per[100] * tl };
  var obTotal = obKr[50] + obKr[70] + obKr[100];
  var grund = S.inst.form === "manad" ? (Number(S.inst.manadslon) || 0) : timmar * tl;
  var brutto = grund + obTotal;
  var sk = S.inst.raknaSkatt ? raknaSkatt(brutto, S.inst) : { skatt: 0, netto: brutto, delar: null };

  return {
    dagarIMan: dagarIMan, perDag: perDag, per: per, timmar: timmar, dagar: dagar,
    obKr: obKr, obTotal: obTotal, grund: grund, brutto: brutto,
    skatt: sk.skatt, netto: sk.netto, delar: sk.delar
  };
}

function radOB(B, p) {
  return '<div class="row" data-off="' + (B.per[p] === 0) + '">' +
    '<span class="k"><i class="dot" style="background:' + FARG[p] + '"></i>OB ' + p + ' %</span>' +
    '<span class="h">' + tim(B.per[p]) + '</span>' +
    '<span class="v">' + kr(B.obKr[p]) + '</span></div>';
}
function radSkatt(etikett, belopp, plus) {
  return '<div class="row" data-plus="' + !!plus + '" data-off="' + (belopp === 0) + '">' +
    '<span class="k">' + esc(etikett) + '</span><span class="h"></span>' +
    '<span class="v">' + kr(plus ? belopp : -belopp) + '</span></div>';
}

/* Full omritning */
function rita() {
  document.getElementById("titel").innerHTML = MAN[S.pek.m] + ' <span>' + S.pek.y + '</span>';
  document.getElementById("toggleSet").setAttribute("data-on", String(S.visaInst));
  var B = berakna();
  renderStub(B);
  renderGrid(B);
  renderSet();
  renderEditor();
  renderFot();
}
/* Lätt omritning: rör inte fälten man skriver i */
function ritaLatt() {
  var B = berakna();
  renderStub(B);
  renderGrid(B);
  renderEditorDelar();
  renderFot();
}

document.getElementById("prev").addEventListener("click", function () {
  var d = new Date(S.pek.y, S.pek.m - 1, 1);
  S.pek = { y: d.getFullYear(), m: d.getMonth() };
  S.vald = null; laddaManad(); rita();
});
document.getElementById("next").addEventListener("click", function () {
  var d = new Date(S.pek.y, S.pek.m + 1, 1);
  S.pek = { y: d.getFullYear(), m: d.getMonth() };
  S.vald = null; laddaManad(); rita();
});
document.getElementById("toggleSet").addEventListener("click", function () {
  S.visaInst = !S.visaInst; rita();
});

laddaManad();
rita();
</script>
